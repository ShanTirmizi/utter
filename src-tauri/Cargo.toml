[package]
name = "utter"
version = "0.6.0"
description = "Hold a hotkey, speak, release. Cleaned-up text lands in the app you are using."
authors = ["Shan Tirmizi"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "utter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# App shell. `tray-icon` gives the menu-bar item; `macos-private-api` allows the
# transparent status pill window.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["time", "sync"] }
futures-util = "0.3.34"
# Checks the Parakeet model files against the hashes Hugging Face publishes.
sha2 = "0.10.9"

# Microphone capture.
cpal = "0.18.2"
# Local speech-to-text (whisper.cpp), GPU-accelerated through Metal.
whisper-rs = { version = "0.16.0", features = ["metal"] }
# HTTPS for the optional cleanup call and the one-time model download.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "stream"] }

# macOS system APIs: Keychain, pasteboard, frontmost app, synthetic key events.
security-framework = "3.7.0"
core-graphics = "0.25.0"
core-foundation = "0.10.1"
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

# Writes the recordings kept for accuracy testing, and reads WAV files in the
# examples.
hound = "3"
nnnoiseless = { version = "0.5", default-features = false }

# Installs a newer release when the user asks: downloads it, checks its
# signature against the public key in tauri.conf.json, and swaps it in place.
tauri-plugin-updater = "2"

[profile.dev]
# Smaller debug builds; line numbers in backtraces are enough here.
debug = "line-tables-only"

# whisper.cpp is unusably slow unoptimised, so optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
